<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos 360 do Imóvel - Tour 360</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="property-photos.css">
    <link rel="stylesheet" href="vendor/photo-sphere-viewer/index.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <h1 class="logo" id="site-logo">🏠 Tour 360 <span class="logo-credit">By CorsaTube360</span></h1>
                <button class="nav-toggle" aria-label="Abrir menu">
                    <span class="hamburger"></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="#gallery">Fotos 360</a></li>
                    <li><a href="#contact-detail">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero photos-hero">
            <div class="container">
                <h2 id="property-title">Fotos 360 do Imóvel</h2>
                <p id="property-subtitle">Selecione qualquer foto para abrir em tela cheia.</p>
                <p id="property-price" class="property-hero-price">R$ 0,00</p>
                <div id="property-meta-icons" class="property-hero-meta"></div>
                <a id="property-tour-link" class="btn btn-primary property-tour-btn" href="https://corsatube360.com.br/tour360/" target="_blank" rel="noopener noreferrer">Tour 360</a>
            </div>
        </section>

        <section id="gallery" class="photos-section">
            <div class="container">
                <div id="photos-grid" class="photos-sections"></div>
            </div>
        </section>

        <section id="contact-detail" class="contact-section detail-contact-section">
            <div class="container">
                <h2>Gostou deste imóvel?</h2>
                <p class="detail-contact-subtitle">Se tiver interesse, preencha o formulário abaixo e entraremos em contato com você.</p>
                <form class="contact-form detail-contact-form" id="detail-contact-form">
                    <input type="text" name="name" placeholder="Seu nome" required>
                    <input type="email" name="email" placeholder="Seu email" required>
                    <input type="tel" name="phone" placeholder="Telefone / WhatsApp" inputmode="tel" pattern="[0-9\s\-\(\)\+]{10,}" title="Informe um telefone válido com DDD" required>
                    <label class="visit-datetime-label" for="visit-datetime-detail">Data e horário da visita</label>
                    <input type="text" id="visit-datetime-detail" name="visit_datetime" class="visit-datetime-input" placeholder="Selecione a data e hora" autocomplete="off" required>
                    <textarea name="message" placeholder="Sua mensagem" rows="5" required></textarea>
                    <input type="hidden" name="_subject" value="Interesse em imóvel - Tour 360">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="text" name="_honey" style="display:none">
                    <button type="submit" class="btn btn-primary">Enviar interesse</button>
                </form>
            </div>
        </section>
    </main>

    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/three.module.js"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script type="module" src="property-photos.js"></script>
</body>
</html>
