name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - run: npm install
      - run: npm install -g vite gh-pages

      - run: git config --global user.name "GitHub Actions"
      - run: git config --global user.email "actions@github.com"

      - run: vite build
      # copiar arquivos do site principal para a pasta de saída
      - run: cp -r website/* dist/ || echo "no website folder to copy"

      - run: npx gh-pages -d dist --repo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
